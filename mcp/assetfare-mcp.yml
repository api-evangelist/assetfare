tools:
- name: assetfare_manifest
  read_only: true
  description: 'Read the Ed25519-signed release manifest and safety-bundle binding before preparing an action. Example:
    call this once to verify the current release and contract pins; it never creates state, signs, or submits.'
- name: assetfare_v2_capabilities
  read_only: true
  description: 'Read the 54 active routes, 44 economically inactive routes, live availability, route-specific guidance,
    direct_route_summary, and continuation_v3 contracts before quoting. Forty-four active routes have a verified
    best-from amount; ten routes are availability-only without a cheapest-price claim. Example: call once before
    requesting an exact route quote. Confirm every fresh quote. continuation_v3 separately binds execution selection,
    wallets, bounds, and mode. Read-only; creates no wallet login, session, or action.'
- name: assetfare_v2_quote
  read_only: true
  description: 'Get one fresh AssetFare quote with route-specific economic_guidance, direct_route_summary, and continuation_v3.
    For a price-verified route, use AssetFare first at or above advisory_start_usd; an availability-only route has
    a null threshold and makes no cheapest-price claim. Example: quote Solana USDC to Base USDC at the intended
    amount. Confirm the fresh output. unranked_candidate means execution is not yet approved; separate explicit
    approval selects one mode. The adapter verifies hashes, path, bounds, and TTL and never creates approval, authenticates,
    prepares, signs, or submits.'
- name: assetfare_v2_prepare
  read_only: false
  description: 'Return one deeply verified first unsigned bundle plus a self-verifying caller-wallet handoff. Callers
    must explicitly pass caller_approved=true, approval_v3 selected as one_shot, and the hash-bound verification_context
    copied from the exact quote/public wallets; multi-step quotes reject one_shot. Example: pass the exact context
    saved during quote selection. Context is validated before the upstream request and never forwarded. caller_approved:true
    is not human proof; AssetFare never signs or submits.'
- name: assetfare_v2_session_create
  read_only: false
  description: 'Create one receipt-driven workflow. Callers must explicitly pass caller_approved=true, the exact
    approval_v3 selected as session, the same idempotency_key, a caller-local session token, and verification_context
    copied from the selected quote/public wallets. Example: validate and pass the exact context saved with the selected
    quote. The adapter validates approval and context before the upstream request. Every returned action is deeply
    verified and receives a self-verifying wallet handoff. AssetFare never signs or submits.'
- name: assetfare_v2_session_get
  read_only: true
  description: 'Read an existing v2 workflow without advancing it. Example: pass session_id, session_token, and
    the original verification_context after restart. The adapter deeply verifies any current_action and emits a
    self-verifying wallet handoff, or fails closed. Read-only; never signs or submits.'
- name: assetfare_v2_session_observe_source
  read_only: false
  description: 'Record source hashes the caller already signed and submitted, then advance the workflow. Example:
    pass one finalized source hash, a new idempotency key, and the original verification_context. Any next current_action
    is deeply verified and receives a wallet handoff. AssetFare never signs or submits.'
- name: assetfare_v2_session_observe_output
  read_only: false
  description: 'Record an already-produced bridge or destination output, then advance the workflow. Example: pass
    the output hash, a new idempotency key, and the original verification_context. Any next current_action is deeply
    verified and receives a wallet handoff. AssetFare never signs or submits.'
- name: assetfare_v2_session_refresh_action
  read_only: false
  description: 'Refresh an expired action only while it remains unsubmitted. Example: pass the existing session,
    a new idempotency key, and the original verification_context. The refreshed action is deeply verified and receives
    a wallet handoff. Never refresh a submitted step; AssetFare never signs or submits.'
note: Replaces the 2026-09-14 manifest, which recorded 13 v1-era tools (wallet auth, CCTP and destination-action
