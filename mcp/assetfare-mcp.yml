tools:
  - name: assetfare_status
    read_only: true
    description: Read current capabilities, caps, pause state, and independent RPC quorum.
  - name: assetfare_manifest
    read_only: true
    description: Read the Ed25519-signed capability, contract, release, and mainnet-evidence manifest.
  - name: assetfare_quote
    read_only: true
    description: Get a fee-inclusive Solana SOL to Base or Arbitrum ETH quote. Creates no session or transaction.
  - name: assetfare_start_wallet_auth
    read_only: false
    description: Create a non-transactional Solana signMessage challenge.
  - name: assetfare_finish_wallet_auth
    read_only: false
    description: Verify a wallet signature over the challenge and return a wallet-bound access token.
  - name: assetfare_create_session
    read_only: false
    description: Lock a fresh quote into a wallet-bound execution session.
  - name: assetfare_read_session
    read_only: true
    description: Read a wallet-bound session, workflow, receipt, or current unsigned action.
  - name: assetfare_prepare_source_action
    read_only: false
    description: Prepare a bounded unsigned Solana source action. Never signs or submits.
  - name: assetfare_verify_source_receipt
    read_only: false
    description: Verify a caller-submitted finalized Solana source signature and advance the workflow.
  - name: assetfare_prepare_cctp_action
    read_only: false
    description: Prepare an unsigned CCTP burn action using a caller-generated event signer public key.
  - name: assetfare_observe_cctp
    read_only: false
    description: Verify Circle attestation and the forwarded Base/Arbitrum USDC mint for a submitted burn.
  - name: assetfare_prepare_destination_action
    read_only: false
    description: Prepare the exact-cap permit and unsigned ERC-4337 destination settlement plan.
  - name: assetfare_observe_destination
    read_only: false
    description: Verify a submitted destination UserOperation receipt and finalize the workflow.
