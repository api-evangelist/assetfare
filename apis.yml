name: AssetFare
description: Agent-native, non-custodial native-USDC bridge and cross-chain quote API across six
  chains. The canonical route is Solana native USDC to Base native USDC with a caller-approved
  unsigned plan. AssetFare service fee 1bp; Circle/provider/network fees additional; each quote
  exposes total token-path cost and live availability. The caller verifies, signs, and submits;
  AssetFare never signs or submits.
