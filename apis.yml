name: AssetFare
description: A capped, non-custodial route API for AI agents across Solana, Base, Arbitrum, and Robinhood Chain. The public v2
  surface quotes 72 directed routes among nine asset endpoints from $1 through $1,000. Later workflow steps return bounded unsigned
  actions that callers verify, sign, and submit. AssetFare never receives private keys, signs, or submits, and is one route
  candidate rather than a market-wide best-price aggregator.
