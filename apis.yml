name: AssetFare
description: >-
  A capped, non-custodial routing API for a single corridor — Solana SOL to Base native ETH — aimed at AI agents. It
  returns fee-inclusive quotes and bounded unsigned actions; the caller's agent verifies, signs, and submits every
  transaction. AssetFare never receives private keys and never signs or submits, framing itself as one route candidate
  rather than a market-wide best-price aggregator.
