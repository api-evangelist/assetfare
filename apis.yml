name: AssetFare
description: >-
  A non-custodial routing API for AI agents that returns fee-inclusive cross-chain and same-chain quotes and
  bounded unsigned actions; the caller's own wallet verifies, signs and submits every transaction, and AssetFare
  never holds keys, signs or submits. Its live v2 capabilities document (checked 2026-10-03) lists 16 chains, 20
  asset endpoints and 54 active directed routes (a further 44 measured routes are inactive), with a USD 1 minimum,
  no business maximum and an exact 1 bp service fee on top of provider and network fees. The v2 REST contract
  covers capabilities, quote, prepare, a receipt-driven session lifecycle and status; the same surface is offered
  over MCP and A2A, and a legacy v1 compatibility API remains live.
