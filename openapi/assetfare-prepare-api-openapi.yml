                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - xlayer
              - if:
                  properties:
                    from_chain:
                      const: xlayer
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - xlayer
              - if:
                  properties:
                    from_chain:
                      const: sei
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - sei
              - if:
                  properties:
                    from_chain:
                      const: sei
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - sei
              - if:
                  properties:
                    from_chain:
                      const: sonic
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - sonic
              - if:
                  properties:
                    from_chain:
                      const: sonic
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - sonic
              - if:
                  properties:
                    from_chain:
                      const: monad
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - monad
              - if:
                  properties:
                    from_chain:
                      const: monad
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - monad
              - if:
                  properties:
                    from_chain:
                      const: avalanche
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - avalanche
              - if:
                  properties:
                    from_chain:
                      const: avalanche
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - avalanche
              - if:
                  properties:
                    from_chain:
                      const: cronos
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - cronos
              - if:
                  properties:
                    from_chain:
                      const: cronos
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - cronos
              - if:
                  properties:
                    from_chain:
                      const: injective
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - injective
              - if:
                  properties:
                    from_chain:
                      const: injective
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - injective
              - if:
                  properties:
                    from_chain:
                      const: linea
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - linea
              - if:
                  properties:
                    from_chain:
                      const: linea
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - linea
              - if:
                  properties:
                    from_chain:
                      const: aptos
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - aptos
              - if:
                  properties:
                    from_chain:
                      const: aptos
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - aptos
              properties:
                amount_usd:
                  description: No business maximum. USD 1 is supported for reachability smoke testing only. Prefer AssetFare only when the returned economic_guidance.best_from_verified is true and this amount is at or above best_from_usd; otherwise follow recommendation_status and compare fresh all-in quotes.
                  minimum: 1
                  type: number
                approval_v3:
                  additionalProperties: false
                  properties:
                    direct_route_summary_sha256:
                      pattern: ^[0-9a-f]{64}$
                      type: string
                    idempotency_key:
                      pattern: ^[A-Za-z0-9._:-]{8,128}$
                      type: string
                    maximum_input_base:
                      pattern: ^[1-9][0-9]*$
                      type: string
                    minimum_output_base:
                      pattern: ^[1-9][0-9]*$
                      type: string
                    quote_fingerprint:
                      pattern: ^[0-9a-f]{64}$
                      type: string
                    quote_id:
                      format: uuid
                      type: string
                    selected_mode:
                      const: one_shot
                    selection_status:
                      const: selected
                    version:
                      const: assetfare-quote-bound-approval-v3
                  required:
                  - version
                  - quote_id
                  - quote_fingerprint
                  - selection_status
                  - selected_mode
                  - maximum_input_base
                  - minimum_output_base
                  - direct_route_summary_sha256
                  - idempotency_key
                  type: object
                caller_approved:
                  const: true
                  description: Legacy caller assertion retained for compatibility. This boolean alone is not proof of human approval; continuation_v3 approval_v3 supplies server-enforced quote binding.
                  type: boolean
                event_signer_public:
                  description: Caller-generated, base58-encoded 32-byte Solana Ed25519 public key that is on curve and can co-sign the CCTP event-account transaction. Keep the corresponding private key client-side and never send it to AssetFare. Required only when a route includes a Solana CCTP burn.
                  maxLength: 44
                  minLength: 32
                  pattern: ^[1-9A-HJ-NP-Za-km-z]+$
                  type: string
                from_chain:
                  enum:
                  - solana
                  - base
                  - arbitrum
                  - robinhood
                  - optimism
                  - ethereum
                  - hyperevm
                  - xlayer
                  - sei
                  - sonic
                  - monad
                  - avalanche
                  - cronos
                  - injective
                  - linea
                  - aptos
                  type: string
                from_token:
                  enum:
                  - SOL
                  - ETH
                  - USDC
                  - USDG
                  type: string
                to_chain:
                  enum:
                  - solana
                  - base
                  - arbitrum
                  - robinhood
                  type: string
                to_token:
                  enum:
                  - SOL
                  - ETH
                  - USDC
                  - USDG
                  type: string
                wallets:
                  additionalProperties: false
                  properties:
                    aptos:
                      description: Caller-controlled Aptos account address.
                      pattern: ^0x[0-9a-fA-F]{64}$
                      type: string
                    arbitrum:
                      description: Caller-controlled arbitrum EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    avalanche:
                      description: Caller-controlled avalanche EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    base:
                      description: Caller-controlled base EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    cronos:
                      description: Caller-controlled cronos EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    ethereum:
                      description: Caller-controlled ethereum EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    hyperevm:
                      description: Caller-controlled hyperevm EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    injective:
                      description: Caller-controlled injective EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    linea:
                      description: Caller-controlled linea EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    monad:
                      description: Caller-controlled monad EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    optimism:
                      description: Caller-controlled optimism EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    polygon:
                      description: Caller-controlled polygon EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    robinhood:
                      description: Caller-controlled robinhood EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    sei:
                      description: Caller-controlled sei EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    solana:
                      description: Caller-controlled, base58-encoded 32-byte Solana Ed25519 public key that is on curve and can sign. Program-derived/off-curve addresses are rejected.
                      maxLength: 44
                      minLength: 32
                      pattern: ^[1-9A-HJ-NP-Za-km-z]+$
                      type: string
                    sonic:
                      description: Caller-controlled sonic EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                    xlayer:
                      description: Caller-controlled xlayer EVM address.
                      pattern: ^0x[0-9a-fA-F]{40}$
                      type: string
                  required: []
                  type: object
              required:
              - from_chain
              - from_token
              - to_chain
              - to_token
              - amount_usd
              - caller_approved
              - wallets
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnsignedActionBundle'
          description: Unsigned action bundle with a raw-payload-bound safety receipt
        '400':
          description: Invalid request; response lists missing_fields, unexpected_fields, required_fields and explains event_signer_public when applicable
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteBoundReapprovalRequiredV3'
          description: Quote binding expired, changed, replayed, or outside caller bounds; no action was created and a new read-only quote requires reapproval
        '429':
          description: Rate limited
        '502':
          description: Provider or unsigned-action builder temporarily unavailable with retry guidance
        '503':
          description: Capacity busy
      summary: Get a validated unsigned action bundle
      tags:
      - Prepare
components:
  schemas:
    ActionSafetyReceiptV1:
      additionalProperties: false
      description: Deterministically recomputed from decoded/raw unsigned action data. This is a consistency receipt, not a signature or a subjective safe=true claim.
      properties:
        action:
          additionalProperties: false
          properties:
            builder_version:
              type:
              - string
              - 'null'
            kind:
              enum:
              - evm_dex
              - solana_dex
              - evm_cctp
              - evm_cctp_receive
              - solana_cctp
              - aptos_cctp
              - evm_layerzero
              - solana_layerzero
              - evm_across
            provider:
              type: string
          required:
          - kind
          - provider
          - builder_version
          type: object
        approval:
          additionalProperties: false
          properties:
            exact_allowance_base:
              pattern: ^[0-9]+$
              type:
              - string
              - 'null'
            required:
              type: boolean
            target:
              type:
              - string
              - 'null'
            token:
              type:
              - string
              - 'null'
            transaction_index:
              minimum: 0
              type: integer
          required:
          - required
          - token
          - target
          - exact_allowance_base
          type: object
        assetfare_service_fee:
          additionalProperties: false
          properties:
            amount_known_before_execution:
              type: boolean
            basis:
              additionalProperties: false
              properties:
                amount_base:
                  pattern: ^[0-9]+$
                  type:
                  - string
                  - 'null'
                kind:
                  type: string
              required:
              - kind
              - amount_base
              type: object
            bps:
              maximum: 1
              minimum: 0
              type: integer
            exact_amount_base:
              pattern: ^[0-9]+$
              type:
              - string
              - 'null'
            formula:
              const: floor(fee_basis_base * bps / 10000)
            recipient:
              type:
              - string
              - 'null'
          required:
          - basis
          - bps
          - formula
          - exact_amount_base
          - amount_known_before_execution
          - recipient
          type: object
        custody:
          additionalProperties: false
          properties:
            server_signing:
              const: false
            server_submission:
              const: false
          required:
          - server_signing
          - server_submission
          type: object
        destination:
          additionalProperties: false
          properties:
            domain:
              type:
              - integer
              - string
              - 'null'
            recipient:
              type:
              - string
              - 'null'
          required:
          - recipient
          - domain
          type: object
        generation:
          const: decoded_built_action_only
        native_value_cap:
          additionalProperties: false
          properties:
            maximum_base:
              pattern: ^[0-9]+$
              type: string
            per_transaction_base:
              items:
                pattern: ^[0-9]+$
                type: string
              type: array
            unit:
              enum:
              - wei
              - lamports
              - octas
          required:
          - maximum_base
          - unit
          - per_transaction_base
          type: object
        network:
          additionalProperties: false
          properties:
            destination_chain:
              type: string
            source_chain:
              type: string
            source_chain_id:
              type:
              - integer
              - string
          required:
          - source_chain
          - source_chain_id
          - destination_chain
          type: object
        parties:
          additionalProperties: false
          properties:
            caller:
              type: string
            fee_payer:
              type: string
          required:
          - caller
          - fee_payer
          type: object
        payload_binding:
          additionalProperties: false
          properties:
            action_sha256:
              pattern: ^[0-9a-f]{64}$
              type: string
            canonicalization:
              const: UTF-8 JSON sorted keys compact separators; omit safety_receipt
            raw_payloads:
              items:
                additionalProperties: false
                properties:
                  chain_id:
                    minimum: 1
                    type: integer
                  data_prefix_hex:
                    pattern: ^[0-9a-f]*$
                    type: string
                  data_sha256:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  index:
                    minimum: 0
                    type: integer
                  instruction_type:
                    type:
                    - string
                    - 'null'
                  kind:
                    enum:
                    - evm_transaction
                    - solana_instruction
                    - aptos_raw_transaction
                  native_value_base:
                    pattern: ^[0-9]+$
                    type: string
                  program_id:
                    type: string
                  raw_sha256:
                    pattern: ^[0-9a-f]{64}$
                    type: string
                  selector:
                    type: string
                  target:
                    type: string
                required:
                - index
                - kind
                - raw_sha256
                - data_sha256
                type: object
              minItems: 1
              type: array
          required:
          - canonicalization
          - action_sha256
          - raw_payloads
          type: object
        receive:
          additionalProperties: false
          properties:
            expected_amount_base:
              pattern: ^[0-9]+$
              type:
              - string
              - 'null'
            minimum_amount_base:
              pattern: ^[0-9]+$
              type: string
            token:
              additionalProperties: false
              properties:
                address_or_mint:
                  type: string
                symbol:
                  type: string
              required:
              - symbol
              - address_or_mint
              type: object
          required:
          - token
          - expected_amount_base
          - minimum_amount_base
          type: object
        risks:
          additionalProperties: false
          properties:
            caller_verification_required:
              const: true
            provider:
              items:
                type: string
              minItems: 1
              type: array
            unpriced:
              items:
                type: string
              minItems: 1
              type: array
          required:
          - unpriced
          - provider
          - caller_verification_required
          type: object
        schema:
          const: https://assetfare.dev/schemas/action-safety-receipt-v1
        schema_version:
          const: 1
        selector_or_instruction_allowlist:
          items:
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        spend:
          additionalProperties: false
          properties:
            exact_amount_base:
              pattern: ^[0-9]+$
              type: string
            maximum_amount_base:
              pattern: ^[0-9]+$
              type: string
            token:
              additionalProperties: false
              properties:
                address_or_mint:
                  type: string
                symbol:
                  type: string
              required:
              - symbol
              - address_or_mint
              type: object
          required:
          - token
          - exact_amount_base
          - maximum_amount_base
          type: object
        target_or_program_allowlist:
          items:
            type: string
          minItems: 1
          type: array
          uniqueItems: true
        timing:
          additionalProperties: false
          properties:
            action_deadline_unix:
              type:
              - integer
              - 'null'
            bundle_expires_at:
              format: date-time
              type:
              - string
              - 'null'
            quote_expiry_unix:
              type:
              - integer
              - 'null'
            recent_blockhash:
              type:
              - string
              - 'null'
          required:
          - action_deadline_unix
          - quote_expiry_unix
          - recent_blockhash
          - bundle_expires_at
          type: object
