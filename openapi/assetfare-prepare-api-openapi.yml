openapi: 3.2.0
info:
  contact:
    email: support@assetfare.dev
    name: AssetFare support
    url: https://assetfare.dev/security/
  description: 'Agent-native, non-custodial direct-protocol quotes and caller-signed unsigned actions on 54 active routes; 44 measured routes remain inactive. Forty-four active routes publish a verified best-from amount and ten routes are availability-only with no cheapest-price claim. Solana native USDC to Base native USDC is the canonical example. Agents confirm every fresh quote before choosing. Every quote includes direct_route_summary: an intent-bound ordered provider path with normalized chain:asset endpoints, exact base-unit bounds and the AssetFare fee step. All current public routes are direct_protocol_only; external_intent remains a compatibility enum with zero current routes. route_aggregator_used=false is scoped to AssetFare''s engine and does not rule out provider-internal liquidity sourcing. The server never signs or submits. Contract 2.6.0 uses a language-neutral continuation_v3 quote-payload hash projection and server-enforced quote binding. Legacy prepare/session remain legacy_advisory; caller_approved:true alone is not proof of human approval. ActionSafetyReceiptV1 and caller-owned session capability tokens remain required.'
  license:
    name: Proprietary public API terms
    url: https://assetfare.dev/terms/
  termsOfService: https://assetfare.dev/terms/
  title: AssetFare Active-route Agent Prepare API
  version: 2.6.0
servers:
- url: https://api.assetfare.dev
security: []
tags:
- name: Prepare
paths:
  /v2/prepare:
    post:
      description: With approval_v3, the server atomically selects one_shot, fresh-requotes and enforces exact intent/path/providers plus caller maximum-input/minimum-output bounds before action construction. Multi-step routes reject one_shot. Without approval_v3 this is the compatible legacy_advisory path; caller_approved alone is not proof of human approval. AssetFare never signs or submits.
      operationId: prepareMultichainAction
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: false
              allOf:
              - if:
                  properties:
                    from_chain:
                      const: solana
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
              - if:
                  properties:
                    from_chain:
                      const: solana
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - base
                  required:
                  - event_signer_public
              - if:
                  properties:
                    from_chain:
                      const: solana
                    to_chain:
                      const: arbitrum
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - arbitrum
                  required:
                  - event_signer_public
              - if:
                  properties:
                    from_chain:
                      const: solana
                    to_chain:
                      const: robinhood
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - robinhood
              - if:
                  properties:
                    from_chain:
                      const: base
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - base
              - if:
                  properties:
                    from_chain:
                      const: base
                    to_chain:
                      const: robinhood
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - base
                      - robinhood
              - if:
                  properties:
                    from_chain:
                      const: arbitrum
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - arbitrum
              - if:
                  properties:
                    from_chain:
                      const: arbitrum
                    to_chain:
                      const: arbitrum
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - arbitrum
              - if:
                  properties:
                    from_chain:
                      const: arbitrum
                    to_chain:
                      const: robinhood
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - arbitrum
                      - robinhood
              - if:
                  properties:
                    from_chain:
                      const: robinhood
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - robinhood
              - if:
                  properties:
                    from_chain:
                      const: robinhood
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - base
                      - robinhood
                  required:
                  - event_signer_public
              - if:
                  properties:
                    from_chain:
                      const: robinhood
                    to_chain:
                      const: arbitrum
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - arbitrum
                      - robinhood
                  required:
                  - event_signer_public
              - if:
                  properties:
                    from_chain:
                      const: robinhood
                    to_chain:
                      const: robinhood
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - robinhood
              - if:
                  properties:
                    from_chain:
                      const: optimism
                    to_chain:
                      const: base
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - base
                      - optimism
              - if:
                  properties:
                    from_chain:
                      const: ethereum
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
                      - solana
                      - ethereum
              - if:
                  properties:
                    from_chain:
                      const: hyperevm
                    to_chain:
                      const: solana
                  required:
                  - from_chain
                  - to_chain
                then:
                  properties:
                    wallets:
                      required:
